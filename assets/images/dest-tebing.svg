  <ellipse cx="380" cy="310" rx="90" ry="25" fill="#38BDF8" opacity="0.4"/>
  <ellipse cx="490" cy="340" rx="70" ry="20" fill="#0EA5E9" opacity="0.5"/>
  <path d="M 420 300 Q 450 270, 480 290 T 520 340 L 400 340 Z" fill="#94A3B8"/>
  <!-- Surf Foam -->
