<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="tSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="tSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
  </defs>
  <rect width="600" height="240" fill="url(#tSky)"/>
  <circle cx="480" cy="90" r="35" fill="#FEF08A"/>
  <!-- Clouds -->
  <path d="M 60 110 Q 90 90, 130 100 Q 160 85, 200 105 Q 230 115, 220 130 L 50 130 Z" fill="#FFFFFF" opacity="0.8"/>
  <rect y="220" width="600" height="180" fill="url(#tSea)"/>
