  <path d="M 0 180 Q 70 200, 100 240 T 180 320 L 0 400 Z" fill="#CBD5E1"/>
  <path d="M 120 215 Q 150 170, 200 180 Q 250 240, 230 330 Z" fill="#F1F5F9"/>
