<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgAsep2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0E5F78"/>
      <stop offset="100%" stop-color="#072C38"/>
    </radialGradient>
    <radialGradient id="skinAsep" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#C8935A"/>
      <stop offset="70%" stop-color="#A8723A"/>
      <stop offset="100%" stop-color="#8A5820"/>
    </radialGradient>
    <linearGradient id="vestAsep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D3B72"/>
    </linearGradient>
    <filter id="shadow-face">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000040"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgAsep2)"/>
  <!-- Subtle beach/ocean hint in bg -->
  <path d="M 0 130 Q 40 120, 80 128 T 160 124 T 200 128 L 200 200 L 0 200 Z" fill="#0A3A48" opacity="0.6"/>
  <path d="M 0 150 Q 60 142, 120 150 T 200 148 L 200 200 L 0 200 Z" fill="#062028" opacity="0.8"/>

  <!-- Neck -->
  <ellipse cx="100" cy="132" rx="16" ry="14" fill="#B07A40"/>

  <!-- Body / Vest (Field Guide Jacket) -->
  <path d="M 40 200 C 40 155, 68 142, 100 140 C 132 142, 160 155, 160 200 Z" fill="url(#vestAsep)"/>
  <!-- Vest lapels / collar -->
  <path d="M 84 142 L 100 165 L 116 142 L 100 148 Z" fill="#E8E8E8"/>
  <!-- Vest pocket stripe -->
  <rect x="60" y="158" width="22" height="14" rx="2" fill="#1A72D4" stroke="#0D4A8E" stroke-width="1"/>
  <line x1="60" y1="164" x2="82" y2="164" stroke="#FFFFFF" stroke-width="0.8" opacity="0.5"/>
  <!-- Logo/patch on vest -->
  <circle cx="135" cy="162" r="9" fill="#F9A825"/>
  <text x="135" y="166.5" font-size="8" font-weight="bold" text-anchor="middle" fill="#0D3B72" font-family="Arial">KT</text>

  <!-- Head / Face (filter for depth) -->
  <ellipse cx="100" cy="85" rx="37" ry="40" fill="url(#skinAsep)" filter="url(#shadow-face)"/>

  <!-- Field / Outdoor Cap (dark navy) -->
  <path d="M 63 80 C 63 52, 137 52, 137 80 C 145 80, 150 84, 137 86 C 120 86, 80 86, 63 86 C 50 84, 55 80, 63 80 Z" fill="#1A237E"/>
  <rect x="65" y="73" width="70" height="8" rx="3" fill="#283593"/>
  <!-- Cap visor -->
  <path d="M 60 85 Q 56 92, 50 93 Q 60 96, 75 92 Q 65 88, 60 85 Z" fill="#1A237E"/>
  <!-- Cap logo on front -->
  <path d="M 92 62 Q 100 55, 108 62 L 104 69 L 96 69 Z" fill="#F9A825" opacity="0.9"/>

  <!-- Face features -->
  <!-- Eyebrows -->
  <path d="M 82 86 Q 88 83, 94 85" stroke="#5A3010" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M 106 85 Q 112 83, 118 86" stroke="#5A3010" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Eyes -->
  <ellipse cx="88" cy="91" rx="5.5" ry="5.5" fill="#FFFFFF"/>
  <ellipse cx="112" cy="91" rx="5.5" ry="5.5" fill="#FFFFFF"/>
  <circle cx="89" cy="91" r="3.5" fill="#2C1500"/>
  <circle cx="113" cy="91" r="3.5" fill="#2C1500"/>
  <circle cx="90" cy="89.5" r="1.2" fill="#FFFFFF"/>
  <circle cx="114" cy="89.5" r="1.2" fill="#FFFFFF"/>
  <!-- Nose -->
  <path d="M 100 96 Q 97 103, 94 105 Q 100 107, 106 105 Q 103 103, 100 96 Z" fill="#8A5820" opacity="0.5"/>
  <!-- Friendly smile -->
  <path d="M 88 110 Q 100 120, 112 110" stroke="#7A3C18" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Teeth hint -->
  <path d="M 90 112 Q 100 118, 110 112 Q 100 116, 90 112 Z" fill="#FFFFFF" opacity="0.7"/>
  <!-- Ear (left) -->
  <ellipse cx="63" cy="92" rx="6" ry="8" fill="#B07A40"/>
  <!-- Chin shadow -->
  <path d="M 82 120 Q 100 128, 118 120" stroke="#8A5820" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Verified / Certified Badge -->
  <circle cx="152" cy="152" r="18" fill="#00897B" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M 144 152 L 150 158 L 161 143" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
