<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgDedi2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4A5568"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </radialGradient>
    <radialGradient id="skinDedi" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#C08040"/>
      <stop offset="70%" stop-color="#A06020"/>
      <stop offset="100%" stop-color="#7A4510"/>
    </radialGradient>
    <linearGradient id="jacketDedi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#546E7A"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="cameraDedi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#455A64"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <filter id="face-shadow-d">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#00000050"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#bgDedi2)"/>
  <!-- Subtle ocean/sky bg -->
  <path d="M 0 125 Q 50 115, 100 122 T 200 118 L 200 200 L 0 200 Z" fill="#1A2530" opacity="0.7"/>

  <!-- Body / Photo vest / jacket -->
  <path d="M 35 200 C 35 150, 66 136, 100 135 C 134 136, 165 150, 165 200 Z" fill="url(#jacketDedi)"/>
  <!-- Multiple pockets (photographer vest detail) -->
  <rect x="48" y="155" width="20" height="14" rx="2" fill="#455A64" stroke="#37474F" stroke-width="1"/>
  <rect x="55" y="159" width="8" height="6" rx="1" fill="#B0BEC5" opacity="0.4"/>
  <rect x="132" y="155" width="20" height="14" rx="2" fill="#455A64" stroke="#37474F" stroke-width="1"/>
  <!-- Collar / scarf -->
  <path d="M 78 137 L 100 162 L 122 137 L 100 147 Z" fill="#ECEFF1"/>

  <!-- Camera strap across chest -->
  <path d="M 68 140 Q 78 160, 105 165 Q 132 160, 142 140" stroke="#8D6E4A" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Neck -->
  <ellipse cx="100" cy="128" rx="14" ry="13" fill="#A06020"/>

  <!-- Head -->
  <ellipse cx="100" cy="82" rx="36" ry="40" fill="url(#skinDedi)" filter="url(#face-shadow-d)"/>

  <!-- Hair (short, neat) -->
  <path d="M 64 78 C 64 46, 136 46, 136 78 C 136 72, 126 65, 100 65 C 74 65, 64 72, 64 78 Z" fill="#1A1005"/>
  <!-- Hair texture -->
  <path d="M 68 70 Q 80 62, 100 62 Q 120 62, 132 70" stroke="#2C1A08" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Glasses / Eyewear (rectangular, modern) -->
  <rect x="74" y="80" width="22" height="14" rx="4" fill="none" stroke="#263238" stroke-width="2.5"/>
  <rect x="104" y="80" width="22" height="14" rx="4" fill="none" stroke="#263238" stroke-width="2.5"/>
  <line x1="96" y1="87" x2="104" y2="87" stroke="#263238" stroke-width="2.5"/>
  <!-- Glasses temples -->
  <line x1="74" y1="87" x2="64" y2="88" stroke="#263238" stroke-width="2"/>
  <line x1="126" y1="87" x2="136" y2="88" stroke="#263238" stroke-width="2"/>
  <!-- Lens tint -->
  <rect x="75" y="81" width="20" height="12" rx="3" fill="#263238" opacity="0.15"/>
  <rect x="105" y="81" width="20" height="12" rx="3" fill="#263238" opacity="0.15"/>

  <!-- Eyes behind glasses -->
  <ellipse cx="85" cy="87" rx="4.5" ry="4.5" fill="#FFFFFF"/>
  <ellipse cx="115" cy="87" rx="4.5" ry="4.5" fill="#FFFFFF"/>
  <circle cx="86" cy="87" r="2.8" fill="#2C1500"/>
  <circle cx="116" cy="87" r="2.8" fill="#2C1500"/>
  <circle cx="87" cy="85.5" r="1" fill="#FFFFFF"/>
  <circle cx="117" cy="85.5" r="1" fill="#FFFFFF"/>

  <!-- Eyebrows -->
  <path d="M 76 78 Q 83 75, 90 77" stroke="#1A0A00" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 110 77 Q 117 75, 124 78" stroke="#1A0A00" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M 100 93 Q 97 100, 94 102 Q 100 104, 106 102 Q 103 100, 100 93 Z" fill="#7A4510" opacity="0.45"/>

  <!-- Smile / confident look -->
  <path d="M 87 110 Q 100 120, 113 110" stroke="#6A3010" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 89 112 Q 100 118, 111 112 Q 100 116, 89 112 Z" fill="#FFFFFF" opacity="0.7"/>

  <!-- Stubble hint (5 o'clock shadow) -->
  <path d="M 84 115 Q 100 124, 116 115" stroke="#3C2010" stroke-width="1" fill="none" opacity="0.4" stroke-dasharray="2,3"/>

  <!-- Camera hanging from strap -->
  <rect x="83" y="158" width="34" height="24" rx="4" fill="url(#cameraDedi)" stroke="#37474F" stroke-width="1.5"/>
  <!-- Camera lens -->
  <circle cx="100" cy="170" r="9" fill="#1C2530" stroke="#546E7A" stroke-width="1.5"/>
  <circle cx="100" cy="170" r="6" fill="#0A1015"/>
  <circle cx="100" cy="170" r="3.5" fill="#1E3A50"/>
  <circle cx="97" cy="167" r="1.5" fill="#5B9BD5" opacity="0.7"/>
  <!-- Camera body detail -->
  <circle cx="88" cy="161" r="3.5" fill="#455A64" stroke="#37474F" stroke-width="1"/>
  <rect x="105" y="158" width="8" height="5" rx="1" fill="#90A4AE"/>

  <!-- Verified Badge -->
  <circle cx="152" cy="152" r="18" fill="#00897B" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M 144 152 L 150 158 L 161 143" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
