<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgRina2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2E7D52"/>
      <stop offset="100%" stop-color="#0A3520"/>
    </radialGradient>
    <radialGradient id="skinRina" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#D4A070"/>
      <stop offset="70%" stop-color="#B87848"/>
      <stop offset="100%" stop-color="#9A5E30"/>
    </radialGradient>
    <linearGradient id="jacketRina" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00796B"/>
      <stop offset="100%" stop-color="#004D40"/>
    </linearGradient>
    <filter id="face-shadow-r">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#00000040"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgRina2)"/>
  <!-- Background nature hint -->
  <path d="M 0 120 Q 50 108, 100 118 T 200 114 L 200 200 L 0 200 Z" fill="#0A4528" opacity="0.6"/>

  <!-- Body / Jacket Teal -->
  <path d="M 38 200 C 38 152, 68 138, 100 137 C 132 138, 162 152, 162 200 Z" fill="url(#jacketRina)"/>

  <!-- Neck -->
  <ellipse cx="100" cy="130" rx="15" ry="13" fill="#B87848"/>

  <!-- Inner collar / scarf base -->
  <path d="M 70 138 L 100 175 L 130 138 L 100 148 Z" fill="#B0BEC5"/>
  <!-- Jacket detail / lapel -->
  <path d="M 68 150 L 85 180 L 100 155 Z" fill="#26A69A" opacity="0.5"/>
  <path d="M 132 150 L 115 180 L 100 155 Z" fill="#26A69A" opacity="0.5"/>

  <!-- Head -->
  <ellipse cx="100" cy="83" rx="36" ry="39" fill="url(#skinRina)" filter="url(#face-shadow-r)"/>

  <!-- Hijab / Head covering (white/light gray - neat, modern) -->
  <!-- Hijab volume wrap -->
  <path d="M 62 83 C 62 50, 138 50, 138 83 C 148 85, 155 95, 148 108 C 140 122, 125 130, 100 132 C 75 130, 60 122, 52 108 C 45 95, 52 85, 62 83 Z" fill="#ECEFF1"/>
  <!-- Hijab inner face oval opening -->
  <ellipse cx="100" cy="86" rx="29" ry="33" fill="url(#skinRina)"/>
  <!-- Hijab fold detail -->
  <path d="M 62 88 Q 68 108, 72 128" stroke="#CFD8DC" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 138 88 Q 132 108, 128 128" stroke="#CFD8DC" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- Hijab pin/brooch -->
  <circle cx="100" cy="66" r="3" fill="#F9A825"/>
  <!-- Hijab underside / chin frame -->
  <path d="M 72 115 Q 100 126, 128 115 Q 118 130, 100 133 Q 82 130, 72 115 Z" fill="#D7DFE3" opacity="0.6"/>

  <!-- Ear (slightly visible on left) -->
  <ellipse cx="71" cy="90" rx="5" ry="7" fill="#B87848"/>

  <!-- Face features -->
  <!-- Eyebrows (well-shaped) -->
  <path d="M 80 78 Q 86 74, 93 76" stroke="#5A3010" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 107 76 Q 114 74, 120 78" stroke="#5A3010" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Eyes (warm expressive) -->
  <ellipse cx="87" cy="84" rx="5.5" ry="5.5" fill="#FFFFFF"/>
  <ellipse cx="113" cy="84" rx="5.5" ry="5.5" fill="#FFFFFF"/>
  <circle cx="88" cy="84" r="3.5" fill="#2C1A05"/>
  <circle cx="114" cy="84" r="3.5" fill="#2C1A05"/>
  <circle cx="89.5" cy="82.5" r="1.2" fill="#FFFFFF"/>
  <circle cx="115.5" cy="82.5" r="1.2" fill="#FFFFFF"/>
  <!-- Upper eyelash hint -->
  <path d="M 81 81 Q 87 79, 93 81" stroke="#2C1A05" stroke-width="1.2" fill="none" opacity="0.8"/>
  <path d="M 107 81 Q 113 79, 119 81" stroke="#2C1A05" stroke-width="1.2" fill="none" opacity="0.8"/>
  <!-- Nose -->
  <path d="M 100 90 Q 97 97, 94 99 Q 100 101, 106 99 Q 103 97, 100 90 Z" fill="#9A5E30" opacity="0.45"/>
  <!-- Warm open smile -->
  <path d="M 88 106 Q 100 116, 112 106" stroke="#7A3C18" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 90 108 Q 100 114, 110 108 Q 100 112, 90 108 Z" fill="#FFFFFF" opacity="0.75"/>
  <!-- Rosy cheeks hint -->
  <ellipse cx="81" cy="102" rx="8" ry="5" fill="#E57373" opacity="0.18"/>
  <ellipse cx="119" cy="102" rx="8" ry="5" fill="#E57373" opacity="0.18"/>

  <!-- Verified Badge -->
  <circle cx="152" cy="152" r="18" fill="#00897B" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M 144 152 L 150 158 L 161 143" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
