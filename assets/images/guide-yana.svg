<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgYana2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7B341E"/>
      <stop offset="100%" stop-color="#3B1208"/>
    </radialGradient>
    <radialGradient id="skinYana" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#C89050"/>
      <stop offset="70%" stop-color="#A86E30"/>
      <stop offset="100%" stop-color="#885018"/>
    </radialGradient>
    <linearGradient id="shirtYana" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A237E"/>
      <stop offset="100%" stop-color="#0D1549"/>
    </linearGradient>
    <filter id="face-shadow-y">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#00000045"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgYana2)"/>
  <!-- Ocean/reef sunset bg hint -->
  <path d="M 0 115 Q 60 105, 120 112 T 200 108 L 200 200 L 0 200 Z" fill="#5C1E0A" opacity="0.5"/>
  <path d="M 0 145 Q 80 137, 160 144 T 200 142 L 200 200 L 0 200 Z" fill="#2E0A02" opacity="0.6"/>

  <!-- Body / Fishing/field polo shirt (dark navy) -->
  <path d="M 35 200 C 35 152, 65 138, 100 136 C 135 138, 165 152, 165 200 Z" fill="url(#shirtYana)"/>
  <!-- Shirt collar detail -->
  <path d="M 80 138 L 100 160 L 120 138 L 100 146 Z" fill="#283593"/>
  <rect x="97" y="138" width="6" height="22" rx="2" fill="#E8EAF6" opacity="0.3"/>
  <!-- Shirt sleeve detail -->
  <path d="M 35 170 Q 48 155, 65 148" stroke="#283593" stroke-width="3" fill="none"/>
  <path d="M 165 170 Q 152 155, 135 148" stroke="#283593" stroke-width="3" fill="none"/>

  <!-- Neck -->
  <ellipse cx="100" cy="130" rx="15" ry="13" fill="#A06020"/>

  <!-- Head -->
  <ellipse cx="100" cy="82" rx="36" ry="40" fill="url(#skinYana)" filter="url(#face-shadow-y)"/>

  <!-- Fisherman / field hat (bucket hat style) -->
  <!-- Hat brim all around -->
  <ellipse cx="100" cy="76" rx="48" ry="12" fill="#37474F"/>
  <ellipse cx="100" cy="74" rx="42" ry="9" fill="#455A64"/>
  <!-- Hat crown -->
  <path d="M 62 70 C 62 42, 138 42, 138 70 C 138 75, 132 76, 100 76 C 68 76, 62 75, 62 70 Z" fill="#37474F"/>
  <ellipse cx="100" cy="70" rx="36" ry="10" fill="#455A64" opacity="0.6"/>
  <!-- Hat sun protection cord -->
  <path d="M 68 76 Q 70 92, 72 102" stroke="#8D6E4A" stroke-width="1.5" fill="none" opacity="0.8"/>

  <!-- Weathered/sun-exposed skin lines (character) -->
  <!-- Forehead line -->
  <path d="M 80 82 Q 100 80, 120 82" stroke="#885018" stroke-width="0.8" fill="none" opacity="0.5"/>

  <!-- Eyes (slightly squinting from outdoor exposure, experienced look) -->
  <!-- Eyebrows (thick, expressive) -->
  <path d="M 79 86 Q 86 82, 93 84" stroke="#2C1200" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 107 84 Q 114 82, 121 86" stroke="#2C1200" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Eyes -->
  <ellipse cx="87" cy="92" rx="5.5" ry="5" fill="#FFFFFF"/>
  <ellipse cx="113" cy="92" rx="5.5" ry="5" fill="#FFFFFF"/>
  <circle cx="88" cy="92" r="3.3" fill="#1A0A00"/>
  <circle cx="114" cy="92" r="3.3" fill="#1A0A00"/>
  <circle cx="89" cy="90.5" r="1.1" fill="#FFFFFF"/>
  <circle cx="115" cy="90.5" r="1.1" fill="#FFFFFF"/>

  <!-- Nose (broad, characterful) -->
  <path d="M 100 98 Q 96 106, 92 108 Q 100 111, 108 108 Q 104 106, 100 98 Z" fill="#885018" opacity="0.5"/>
  <!-- Nostril hint -->
  <ellipse cx="94" cy="107" rx="3" ry="2" fill="#6A3A0A" opacity="0.35"/>
  <ellipse cx="106" cy="107" rx="3" ry="2" fill="#6A3A0A" opacity="0.35"/>

  <!-- Mustache (short, neat - field guide style) -->
  <path d="M 89 112 Q 100 110, 111 112" stroke="#2C1200" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <!-- Smile / friendly experienced grin -->
  <path d="M 87 117 Q 100 128, 113 117" stroke="#6A3010" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 89 119 Q 100 125, 111 119 Q 100 123, 89 119 Z" fill="#FFFFFF" opacity="0.65"/>

  <!-- Ear -->
  <ellipse cx="64" cy="90" rx="5" ry="7.5" fill="#A06020"/>
  <ellipse cx="136" cy="90" rx="5" ry="7.5" fill="#A06020"/>

  <!-- Fishing rod (prop, subtle) hanging over shoulder -->
  <line x1="145" y1="135" x2="175" y2="200" stroke="#6D4C41" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="175" y1="200" x2="178" y2="190" stroke="#90A4AE" stroke-width="1" opacity="0.6"/>

  <!-- Verified Badge -->
  <circle cx="152" cy="152" r="18" fill="#00897B" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M 144 152 L 150 158 L 161 143" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
