<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="35%" stop-color="#BE185D"/>
      <stop offset="70%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <linearGradient id="sSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="60%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
  </defs>
  <rect width="600" height="260" fill="url(#sSky)"/>
  <circle cx="300" cy="230" r="50" fill="#FFFBEB" opacity="0.95"/>
  <circle cx="300" cy="230" r="100" fill="#FDE047" opacity="0.25"/>
  <rect y="250" width="600" height="150" fill="url(#sSea)"/>
  <!-- Sunset Reflection Beam -->
  <polygon points="260,250 340,250 420,400 180,400" fill="#FDE047" opacity="0.3"/>
  <!-- Wooden Viewing Deck on Cliff -->
  <path d="M 0 220 Q 80 230, 160 270 T 260 400 L 0 400 Z" fill="#292524"/>
  <!-- Gazebo / Deck Rails -->
  <line x1="80" y1="230" x2="180" y2="230" stroke="#F59E0B" stroke-width="4"/>
  <line x1="90" y1="230" x2="90" y2="255" stroke="#F59E0B" stroke-width="3"/>
  <line x1="130" y1="230" x2="130" y2="260" stroke="#F59E0B" stroke-width="3"/>
  <line x1="170" y1="230" x2="170" y2="270" stroke="#F59E0B" stroke-width="3"/>
  <!-- Silhouette of Couple on Deck -->
  <circle cx="115" cy="216" r="4" fill="#1C1917"/>
  <line x1="115" y1="220" x2="115" y2="230" stroke="#1C1917" stroke-width="3"/>
  <circle cx="125" cy="218" r="3.5" fill="#1C1917"/>
  <line x1="125" y1="221" x2="125" y2="230" stroke="#1C1917" stroke-width="3"/>
</svg>
